<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
    <link rel="icon" href="{{url_for('static', filename='logo_1.png')}}">
    <title>Sentipoll: Server Error</title>
    <style>
        #main{
            display: table;
            width: 100%;
            height: 100vh;
            padding-top: 30px;
            padding-left: 30px;
        }
        .opps {
            font-style: oblique;
        }
        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }
        ul li {
            padding-bottom: 5px;
        }
        .btn-404 {
            background-color: #a3a3a3;
            color: #021020;
            border-color: #021020;
            border: 1px solid #707070;
            border-radius: 5px;
        }
        a {
            text-decoration: none;
            color: #000;
        }
        a:hover {
            color: #000;
        }
    </style>
</head>
<body>
    <div id="main">
        <b class="opps fs-1">Oops!</b><hr>
        <h3>500 - Internal Server Error <br>
        Da dieser Fehler nicht auftreten darf, tun sie bitte folgendes: <br><br>
        <b>Bitte kontaktieren Sie uns und teilen Sie uns den Weg zu dem Fehler mit: </b>
        <button type="button" class="btn btn-404"><a href="/">Support</a></button>
        <br><br>
        Anschließend können Sie einen von den Buttons auswählen.</h3><hr>
        <ul>
            <li><button type="button" class="btn btn-404"><a href="/"><img src="{{url_for('static', filename='4_home-icon.png')}}" width="30" height="30"></a></button></li>
            <li><button class="btn btn-404" onclick="javascript:window.history.back();">Zurück zur letzten Seite</button></li>
        </ul>
        <hr>
    </div>
</body>
</html>
