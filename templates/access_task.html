<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="{{url_for('static', filename='defaultstyle.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='navbar.css')}}">
    {% if admin %}
      <link rel="stylesheet" href="{{url_for('static', filename='admin-style.css')}}">
    {% endif %}
    <link rel="icon" href="{{url_for('static', filename='logo_1.png')}}">
    <script src="{{url_for('static', filename='nav.js')}}"></script>
    <title>Aufgabe: Eingabe</title>
  </head>

  <script>
    function send_solved(elementId) {
      if (!(localStorage && 'subtasks_done' in localStorage)) {
        localStorage;
        localStorage.subtasks_done = JSON.stringify([elementId]);
        fetch("/subtask/done?id="+elementId)
        .then((response) => response.json())
        .then((json) => console.log(json));
      }
      else if (!(JSON.parse(localStorage.subtasks_done).includes(elementId))) {
        subtasks_done = JSON.parse(localStorage.subtasks_done);
        subtasks_done.push(elementId);
        localStorage.subtasks_done = JSON.stringify(subtasks_done);
        fetch("/subtask/done?id="+elementId)
        .then((response) => response.json())
        .then((json) => console.log(json));
      }    
      else {
        subtasks_done = JSON.parse(localStorage.subtasks_done);
        subtasks_done.splice(subtasks_done.indexOf(elementId), 1);
        localStorage.subtasks_done = JSON.stringify(subtasks_done);
        fetch("/subtask/undone?id="+elementId)
        .then((response) => response.json())
        .then((json) => console.log(json));
      }
    }
  </script>
  <body>
    {% if user %}
      {% include 'navbar.html' %}
    {% endif %}
    <div class="container dark">
      <div class="box dark">
        <div class="columns is-mobile is-centered dark">
          <div class="column has-text-centered-tablet acess-padding dark">
            <p class="is-family-monospace is-size-2-desktop is-size-3-touch dark-white">{{task.title}}</p>
            <span class="is-size-5-desktop is-size-6-touch is-italic dark-white">Aufgabe:</span>
            <p class="is-size-5-desktop is-size-6-touch">
              {{task.content}}
            </p>
            {% for subtask in task.subtasks %}
              <input type="checkbox" name="subtask_solved" id="{{ subtask.id }}" oninput="send_solved(this.id)">
              {{ subtask.title }}
              <br>
            {% endfor %}
          </div>
        </div>
      </div>
    </div>    
    {% include 'link_git.html' %}
    </div>
  </body>
  <script>
    //check already done subtasks
    for (subtask of JSON.parse(localStorage.subtasks_done)) {
      if (document.getElementById(""+subtask)) {
        document.getElementById(""+subtask).checked = true;
      }
      
    }
  </script>
</html>
