<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="{{url_for('static', filename='defaultstyle.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='navbar.css')}}">
    {% if admin %}
      <link rel="stylesheet" href="{{url_for('static', filename='admin-style.css')}}">
    {% endif %}
    <link rel="icon" href="{{url_for('static', filename='logo_1.png')}}">
    <script src="{{url_for('static', filename='nav.js')}}"></script>
    <title>Aufgabe: Eingabe</title>
  </head>

  <script>
    const key = 0x55;
    // Function to encrypt and store array in LocalStorage
    function encrypt_array(array) {
        const encryptedArray = array.map(element => element ^ key);
        return encryptedArray;
    }

    // Function to retrieve and decrypt array from LocalStorage
    function decrypt_array(key) {
        const encryptedArrayString = localStorage.subtasks_done;
        if (encryptedArrayString) {
            const encryptedArray = JSON.parse(encryptedArrayString);
            const decryptedArray = encryptedArray.map(element => element ^ key); // XOR each element with the key
            console.log(decryptedArray)
            return decryptedArray;
        }
        return null;
    }

    function send_solved(elementId) {
      elementId = parseInt(elementId);
      if (!(localStorage && 'subtasks_done' in localStorage)) {
        localStorage;
        localStorage.subtasks_done = JSON.stringify(encrypt_array([elementId]));
        fetch("/task/done?id="+elementId)
        .then((response) => response.json())
        .then((json) => console.log(json));
      }
      else if (!(decrypt_array().includes(elementId))) {
        subtasks_done = decrypt_array();
        subtasks_done.push(elementId);
        localStorage.subtasks_done = JSON.stringify(encrypt_array(subtasks_done));
        fetch("/task/done?id="+elementId)
        .then((response) => response.json())
        .then((json) => console.log(json));
      }    
      else {
        //localStorage exists, but task is already done
      }
    }
  </script>
  <body>
    {% if user %}
      {% include 'navbar.html' %}
    {% endif %}
    <h1>{{task.title}}</h1>
    {{task.content}}
    <br>
    {% for subtask in task.subtasks %}
      <input type="checkbox" name="subtask_solved" id="{{ subtask.id }}" oninput="send_solved(this.id)">
      {{ subtask.title }}
      <br>
    {% endfor %}
    {% include 'link_git.html' %}
    </div>
  </body>
  <script>
    //check already done subtasks
    for (subtask of decrypt_array()) {
      document.getElementById(""+subtask).checked = true;
    }
  </script>
</html>
