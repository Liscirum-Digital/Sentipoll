<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task: Fortschritt</title>
</head>
<body>
    <h1>Aufgabe: {{task.title}}</h1>
    <table>
        <tr>
            <th>Aufgabe</th>
            <th>Gelöst</th>
        </tr>
        {% for subtask in task.subtasks%}
        <tr>
            <td>{{subtask.title}}</td>
            <td>{{subtask.done}}</td>
        </tr>
            
        {% endfor %}
    </table>
    
</body>
</html>
