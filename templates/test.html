<!DOCTYPE html>
<html>
  <head>
    <title>Responsive Google Chart</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
      /* Ensure the body and html take up the full height and have no margin or padding */
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      /* Style for the chart container to make it responsive */
      .chart_style {
        width: 100%;
        height: 100%;
        box-sizing: border-box; /* Include padding and border in element's total width and height */
      }
    </style>
    <script type="text/javascript">
      google.charts.load('current', {'packages':['corechart']});
      google.charts.setOnLoadCallback(drawChart);

      var chart;

      function drawChart() {
        var data = new google.visualization.DataTable();
        data.addColumn('number', 'Erledigt');

        data.addRows([[4, 1, 2, 3]]);

        var options = {
          title: 'Company Performance',
          seriesType: 'bars',
          legend: { position: 'bottom' }
        };

        var chartDiv = document.getElementById('chart_div');
        var chart = new google.visualization.ComboChart(chartDiv);

        chart.draw(data, options);
      }

      // Add an event listener to redraw the chart when the window is resized
      window.addEventListener('resize', drawChart);
    </script>
  </head>
  <body>
    <div id="chart_div" class="chart_style"></div>
  </body>
</html>
